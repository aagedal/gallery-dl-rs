  commentsCount
  ...CommentTree_post
  ...PostTags_post
  ...Content_post
  ...Content_content
  ...PostFooter_post_2lIf9C
  ...PostComments_post_2lIf9C
  ...Poll_post_2lIf9C
}

fragment TagList_blogs on Tag {
  id
  name
  seoName
  count
  subscribers
  showAsCategory
  mainTag {
    nsfw
    unsafe
    category {
      name
      id
    }
    id
  }
}
