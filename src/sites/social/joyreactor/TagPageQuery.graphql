fragment PostPager_posts_3OSKdM on PostPager {
  posts(page: $page) {
    id
    nsfw
    unsafe
    tags {
      mainTag {
        id
        nsfw
        unsafe
        category {
          id
        }
        userTag {
          state
        }
      }
      id
    }
    user {
      username
      id
    }
    commentsCount
    ...Post_post_2lIf9C
  }
  count
  id
}

fragment PostTags_post on Post {
