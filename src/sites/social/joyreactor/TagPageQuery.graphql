}

fragment Content_content on Content {
  __isContent: __typename
  text
  attributes {
    __typename
    id
    insertId
    ...Attribute_attribute
  }
}

fragment Content_post on Post {
  ...Attribute_post
}

fragment EditableCommentContent_content on Content {
  __isContent: __typename
  text
  attributes {
    __typename
    id
    insertId
    type
    image {
      id
      hasVideo
      type
      width
      height
    }
    ... on CommentAttributeEmbed {
      value
    }
  }
}

fragment Poll_post_2lIf9C on Post {
