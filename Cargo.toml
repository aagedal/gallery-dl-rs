[package]
name = "gallery-dl-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust port of the gallery-dl image gallery downloader"
license = "GPL-2.0-only"
repository = "https://github.com/aagedal/gallery-dl-rs"
readme = "README.md"
keywords = ["gallery-dl", "downloader", "image", "scraper", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
cookie = "0.18"
futures-util = "0.3"
flate2 = "1"
httpdate = "1"
psl = "2"
regex = "1"
encoding_rs = "0.8"
liblzma = { version = "0.4", default-features = false, features = ["static"] }
crc32fast = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
roxmltree = "0.21.1"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "io-util", "io-std", "fs", "sync"] }
url = { version = "2", features = ["serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2", "bzip2-rs", "time"] }
md-5 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
libc = "0.2"
toml = "1"
serde_yaml_ng = "0.10"
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# TLS: the operating system's stack on macOS and Windows; elsewhere rustls
# with the RustCrypto provider and the system's root certificates. Both keep
# every linked dependency compatible with GPL-2.0-only (ring, aws-lc-rs and
# the openssl crate are Apache-2.0 licensed).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "=0.1.0-pre.0"
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[workspace]
members = ["crates/sync_wrapper"]

# sync_wrapper (required by reqwest and tower) is Apache-2.0 only; this
# MIT-licensed reimplementation keeps the binary GPL-2.0-only compatible.
[patch.crates-io]
sync_wrapper = { path = "crates/sync_wrapper" }
