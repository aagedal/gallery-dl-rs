[package]
name = "gallery-dl-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust gallery downloader with a gallery-dl social-site compatibility backend"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
cookie = "0.18"
futures-util = "0.3"
httpdate = "1"
psl = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
roxmltree = "0.21.1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "io-util", "io-std", "fs", "sync"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
