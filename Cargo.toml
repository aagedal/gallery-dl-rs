[package]
name = "gallery-dl-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust gallery downloader with a gallery-dl social-site compatibility backend"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
cookie = "0.18"
futures-util = "0.3"
flate2 = "1"
httpdate = "1"
psl = "2"
regex = "1"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream"] }
roxmltree = "0.21.1"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "io-util", "io-std", "fs", "sync"] }
url = { version = "2", features = ["serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2", "bzip2-rs", "time"] }
md-5 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
libc = "0.2"
toml = "1"
serde_yaml_ng = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
